name: Sync pricing data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-pricing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync pricing from LiteLLM dataset
        run: npm run sync-pricing

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/models.generated.json; then
            echo "No pricing changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/models.generated.json
          git commit -m "chore: sync model pricing data"
          git pull --rebase origin main
          git push origin HEAD:main
